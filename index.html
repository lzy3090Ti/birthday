<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="温馨的生日祝福页面，选择日期即可查看专属祝福卡片与动画效果。">
    <meta name="theme-color" content="#ff6b9d">
    <meta name="color-scheme" content="light">
    <meta name="format-detection" content="telephone=no">
    <title>生日祝福 🌟</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="index.css" as="style">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="index.css" rel="stylesheet">
    <style>
        /* 首屏关键样式，避免字体图标加载前出现布局跳动 */
        .app{max-width:640px;margin:0 auto;padding:24px 16px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom));}
        .skip-link{position:absolute;left:-9999px;top:0;background:#ff6b9d;color:#fff;padding:10px 16px;border-radius:0 0 8px 0;z-index:100;}
        .skip-link:focus{left:0;outline:2px solid #fff;outline-offset:2px;}
        .btn{min-height:44px;touch-action:manipulation;}
        .birthday-input{font-size:16px;min-height:48px;width:100%;}
        .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
        .chip-row .btn{flex:1 1 auto;justify-content:center;}
        .card-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
        .card-actions[hidden]{display:none;}
        .birthday-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
        .meta-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,107,157,.12);color:#b8436f;font-size:13px;line-height:1.4;}
        .meta-tag[hidden]{display:none;}
        .card-skeleton{padding:24px 18px;border-radius:16px;background:rgba(255,255,255,.7);display:flex;flex-direction:column;gap:12px;}
        .card-skeleton[hidden]{display:none;}
        .card-skeleton-line{height:14px;border-radius:8px;background:linear-gradient(90deg,rgba(255,107,157,.12),rgba(255,107,157,.28),rgba(255,107,157,.12));background-size:200% 100%;animation:skeleton-shimmer 1.4s ease-in-out infinite;}
        .card-skeleton-line:nth-child(2){width:80%;}
        .card-skeleton-line:nth-child(3){width:60%;}
        @keyframes skeleton-shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
        @media (prefers-reduced-motion: reduce){.card-skeleton-line{animation:none;}}
        .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
        .birthday-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
        .birthday-actions .btn{flex:1 1 140px;justify-content:center;}
        .noscript-tip{margin:16px;padding:12px 16px;border-radius:12px;background:#fff3f7;color:#b8436f;text-align:center;}
        .card-section-heading{font-size:15px;font-weight:600;color:#b8436f;margin:24px 0 12px;display:flex;align-items:center;gap:8px;}
        .card-section-heading::after{content:"";flex:1;height:1px;background:rgba(255,107,157,.2);}
        .card-placeholder{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 18px;border-radius:16px;background:rgba(255,255,255,.6);border:1px dashed rgba(255,107,157,.35);text-align:center;}
        .card-placeholder-icon{font-size:28px;color:#ff6b9d;}
        .card-placeholder-text{margin:0;color:#8a5a6c;font-size:14px;line-height:1.6;}
        .share-tip{margin:8px 0 0;font-size:13px;color:#b8436f;text-align:center;}
        .share-tip[hidden]{display:none;}

        /* 步骤提示：让操作路径更清晰 */
        .step-bar{display:flex;align-items:center;gap:6px;margin:0 0 18px;padding:0;list-style:none;font-size:12px;color:#8a5a6c;}
        .step-bar li{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
        .step-bar li::after{content:"";width:16px;height:1px;background:rgba(255,107,157,.3);}
        .step-bar li:last-child::after{display:none;}
        .step-dot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(255,107,157,.14);color:#b8436f;font-size:11px;font-weight:600;}
        .step-bar li[aria-current="step"] .step-dot{background:#ff6b9d;color:#fff;}

        /* 日期输入增强 */
        .input-wrap{position:relative;display:flex;align-items:center;gap:8px;}
        .input-wrap .birthday-input{flex:1 1 auto;}
        .input-clear{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,107,157,.35);background:rgba(255,255,255,.8);color:#b8436f;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
        .input-clear[hidden]{display:none;}
        .input-clear:focus-visible{outline:2px solid #ff6b9d;outline-offset:2px;}
        .birthday-hint{margin:8px 0 0;font-size:13px;color:#8a5a6c;line-height:1.5;}
        .birthday-error{margin:8px 0 0;font-size:13px;color:#d23c6a;line-height:1.5;}
        .birthday-preview{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:rgba(255,107,157,.08);color:#7a4358;font-size:14px;line-height:1.6;}
        .birthday-preview.is-empty{color:#9a7a86;background:rgba(255,107,157,.05);}

        /* 月份切换条 */
        .month-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 0;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,107,157,.18);}
        .month-bar-label{flex:1 1 auto;text-align:center;font-size:14px;font-weight:600;color:#b8436f;}
        .month-bar .btn{min-height:40px;padding:0 14px;}

        /* 卡片容器 */
        .card-stage{position:relative;min-height:120px;}
        .card-stage > *{transition:opacity .25s ease;}
        @media (prefers-reduced-motion: reduce){.card-stage > *{transition:none;}}

        /* 小屏优化 */
        @media (max-width:360px){
            .app{padding-left:12px;padding-right:12px;}
            .step-bar{font-size:11px;}
            .birthday-actions .btn{flex:1 1 100%;}
            .month-bar-label{font-size:13px;}
        }

        .visually-hidden:focus{position:static;width:auto;height:auto;clip:auto;white-space:normal;}
    </style>
</head>
<body>
    <a class="skip-link" href="#app">跳到主要内容</a>
    <noscript>
        <p class="noscript-tip">请启用 JavaScript 以体验完整的生日祝福互动效果。</p>
    </noscript>
    <main id="app" class="app" role="main" aria-label="生日祝福页面" tabindex="-1">
        <div class="app-decor" aria-hidden="true">
            <span class="decor-dot decor-dot-1"></span>
            <span class="decor-dot decor-dot-2"></span>
            <span class="decor-dot decor-dot-3"></span>
        </div>
        <header class="app-header">
            <h1 class="app-title">生日祝福 🌟</h1>
            <p class="app-subtitle">选择日期，收获一份专属的祝福</p>
        </header>

        <ol class="step-bar" aria-label="使用步骤">
            <li aria-current="step"><span class="step-dot">1</span>选择日期</li>
            <li><span class="step-dot">2</span>生成祝福</li>
            <li><span class="step-dot">3</span>分享心意</li>
        </ol>

        <section id="birthday-section" class="birthday-section" aria-labelledby="birthday-label">
            <label id="birthday-label" for="birthday-input" class="birthday-label">
                选择生日日期
                <span class="birthday-required" aria-hidden="true">*</span>
            </label>
            <div class="input-wrap">
                <input
                    id="birthday-input"
                    class="birthday-input"
                    type="date"
                    name="birthday"
                    min="1900-01-01"
                    max="2100-12-31"
                    required
                    aria-describedby="birthday-hint birthday-preview birthday-error"
                    aria-invalid="false"
                    autocomplete="bday"
                    inputmode="numeric"
                    placeholder="年 / 月 / 日"
                >
                <button id="input-clear-btn" class="input-clear" type="button" aria-label="清除已选日期" title="清除日期" hidden>
                    <i class="fa fa-times" aria-hidden="true"></i>
                </button>
            </div>
            <p id="birthday-hint" class="birthday-hint">支持移动端日期选择，选好后即可生成祝福卡片。</p>

            <div class="month-bar" role="group" aria-label="按月份快速定位日期">
                <button id="prev-month-btn" class="btn btn-ghost" type="button" aria-label="切换到上一个月">
                    <i class="fa fa-chevron-left" aria-hidden="true"></i>
                </button>
                <span id="month-bar-label" class="month-bar-label" aria-live="polite">本月</span>
                <button id="next-month-btn" class="btn btn-ghost" type="button" aria-label="切换到下一个月">
                    <i class="fa fa-chevron-right" aria-hidden="true"></i>
                </button>
            </div>

            <div class="chip-row" role="group" aria-label="快捷日期选择">
                <button id="today-btn" class="btn btn-ghost" type="button" aria-label="选择今天的日期">
                    <i class="fa fa-calendar-check-o" aria-hidden="true"></i> 今天
                </button>
                <button id="this-month-btn" class="btn btn-ghost" type="button" aria-label="选择本月第一天的日期">
                    <i class="fa fa-calendar" aria-hidden="true"></i> 本月
                </button>
                <button id="next-month-btn" class="btn btn-ghost" type="button" aria-label="选择下个月第一天的日期">
                    <i class="fa fa-calendar-plus-o" aria-hidden="true"></i> 下月
                </button>
            </div>
            <div class="birthday-meta" aria-live="polite" aria-atomic="true">
                <span id="weekday-tag" class="meta-tag" hidden>
                    <i class="fa fa-clock-o" aria-hidden="true"></i>
                    <span id="weekday-text"></span>
                </span>
                <span id="zodiac-tag" class="meta-tag" hidden>
                    <i class="fa fa-star-o" aria-hidden="true"></i>
                    <span id="zodiac-text"></span>
                </span>
                <span id="countdown-tag" class="meta-tag" hidden>
                    <i class="fa fa-hourglass-half" aria-hidden="true"></i>
                    <span id="countdown-text"></span>
                </span>
            </div>
            <p id="birthday-error" class="birthday-error" role="alert" hidden></p>
            <p id="birthday-preview" class="birthday-preview is-empty" aria-live="polite" aria-atomic="true">
                尚未选择日期
            </p>
            <div class="birthday-actions" role="group" aria-label="日期操作">
                <button id="generate-btn" class="btn btn-primary" type="button" aria-label="生成生日祝福卡片">
                    <i class="fa fa-magic" aria-hidden="true"></i> 生成祝福
                </button>
                <button id="reset-btn" class="btn btn-ghost" type="button" aria-label="清空生日日期">
                    <i class="fa fa-eraser" aria-hidden="true"></i> 清空
                </button>
            </div>
        </section>

        <h2 class="card-section-heading" id="card-heading">
            <i class="fa fa-heart" aria-hidden="true"></i> 专属祝福卡片
        </h2>
        <section id="card-section" class="card-section" aria-live="polite" aria-atomic="true" aria-busy="false" aria-labelledby="card-heading" aria-label="祝福卡片区域">
            <div class="card-stage" id="card-stage">
                <!-- 祝福卡片由脚本渲染，以下为不同阶段的占位内容 -->
                <div class="card-placeholder" id="card-placeholder">
                    <i class="fa fa-gift card-placeholder-icon" aria-hidden="true"></i>
                    <p class="card-placeholder-text">还没有祝福卡片，先选择日期吧～</p>
                </div>
                <div class="card-skeleton" id="card-skeleton" hidden aria-hidden="true">
                    <div class="card-skeleton-line"></div>
                    <div class="card-skeleton-line"></div>
                    <div class="card-skeleton-line"></div>
                </div>
                <div id="card-container" class="card-container" hidden></div>
            </div>
        </section>

        <div id="card-actions" class="card-actions" role="group" aria-label="祝福卡片操作" hidden>
            <button id="regenerate-btn" class="btn btn-ghost" type="button" aria-label="重新生成祝福卡片">
                <i class="fa fa-refresh" aria-hidden="true"></i> 换一句祝福
            </button>
            <button id="copy-btn" class="btn btn-ghost" type="button" aria-label="复制当前祝福文字">
                <i class="fa fa-copy" aria-hidden="true"></i> 复制祝福
            </button>
            <button id="pick-again-btn" class="btn btn-ghost" type="button" aria-label="返回并重新选择日期">
                <i class="fa fa-pencil" aria-hidden="true"></i> 重新选日期
            </button>
        </div>
        <p id="share-tip" class="share-tip" role="status" aria-live="polite" hidden></p>
        <footer class="app-footer">
            <p class="app-footer-text">愿每一天都有值得庆祝的小确幸</p>
        </footer>
    </main>
    <script src="index.js" defer></script>
</body>
</html>
