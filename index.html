<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>生日祝福 🌟</title>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="index.css" rel="stylesheet">
    
</head>
<body>
    <!-- 彩屑容器 -->
    <div id="confettiContainer"></div>
    
    <!-- 选择页面 -->
    <div id="selectionPage" class="page">
        <div class="top-bar"></div>
        
        <div class="container">
            <h1 class="main-title">生日快乐 🌟</h1>
            <p class="subtitle">选择你的生日，解锁专属祝福吧！</p>
            
            <div class="card">
                <div class="wheel-section">
                    <h2 class="wheel-title">
                        <i class="fa fa-gift wheel-icon"></i>
                        选择生日日期
                        <i class="fa fa-birthday-cake wheel-icon"></i>
                    </h2>
                    
                    <div class="wheel-container">
                        <!-- 月份选择 -->
                        <div class="wheel-wrapper">
                            <div id="monthWheel" class="wheel">
                                <!-- 月份将通过JS动态生成 -->
                            </div>
                            <div class="wheel-highlight"></div>
                        </div>
                        
                        <div class="wheel-separator">—</div>
                        
                        <!-- 日期选择 -->
                        <div class="wheel-wrapper">
                            <div id="dayWheel" class="wheel">
                                <!-- 日期将通过JS动态生成 -->
                            </div>
                            <div class="wheel-highlight"></div>
                        </div>
                    </div>
                </div>
                
                <button id="submitButton" class="btn btn-primary">
                    <i class="fa fa-magic"></i> 解锁祝福
                </button>
            </div>
            
            <div class="wishes-list">
                <h2 class="list-title">
                    <i class="fa fa-list-alt"></i>已准备的祝福
                </h2>
                
                <div class="wish-item">
                    <div class="wish-date">01-01</div>
                    <div class="wish-text">新岁初始，愿你如朝阳般热烈，全年都被好运包围～</div>
                </div>
                
                <div class="wish-item">
                    <div class="wish-date">05-20</div>
                    <div class="wish-text">在充满爱意的日子里，祝你不止生日快乐，更要每天都被温柔填满～</div>
                </div>
                
                <div class="wish-item">
                    <div class="wish-date">10-01</div>
                    <div class="wish-text">与国同庆的你，自带光芒万丈的气场！愿你永远自由洒脱～</div>
                </div>
            </div>
            
            <div class="hint-box">
                <div class="hint-title">
                    <i class="fa fa-lightbulb-o"></i> 小提示
                </div>
                <div class="hint-text">
                    滑动选择你的生日月份和日期，点击解锁按钮查看祝福～
                </div>
            </div>
            
            <div class="footer">
                用满满的爱制作 ❤️
            </div>
        </div>
        
        <!-- 装饰元素 -->
        <div class="decor decor-1"></div>
        <div class="decor decor-2"></div>
    </div>
    
    <!-- 祝福页面 -->
    <div id="wishPage" class="page page-hidden wish-page">
        <div class="top-bar"></div>
        
        <div class="wish-content">
            <div class="wish-stars">
                <i class="fa fa-star wish-star"></i>
                <i class="fa fa-star wish-star"></i>
                <i class="fa fa-star wish-star"></i>
            </div>
            
            <h2 class="wish-main-title">生日快乐！</h2>
            
            <div class="wish-message-box">
                <div id="wishMessage" class="wish-message">
                    <!-- 祝福内容将在这里显示 -->
                </div>
            </div>
            
            <button id="backButton" class="btn btn-secondary back-btn">
                <i class="fa fa-arrow-left"></i> 返回
            </button>
        </div>
        
        <div class="wish-footer">
            🎉 特别的祝福给特别的你 🎉
        </div>
        
        <!-- 背景装饰 -->
        <div class="decor decor-1" style="top: 50px; left: 50px;"></div>
        <div class="decor decor-2" style="bottom: 50px; right: 50px;"></div>
    </div>
    
    <script>
        // 生日祝福数据
        const birthdayWishes = {
            "01-01": "新岁初始，愿你如朝阳般热烈，全年都被好运包围～ 生日快乐，我的超人朋友！愿你新的一岁，所求皆如愿，所行皆坦途！",
            "02-14": "在这个充满爱的日子里出生的你，一定是上帝派来的小天使吧！愿你的世界永远被爱包围，生日快乐！每天都像情人节一样甜蜜～",
            "05-20": "在充满爱意的日子里，祝你不止生日快乐，更要每天都被温柔和偏爱填满～ 愿你被世界温柔以待，笑容永远灿烂！",
            "06-01": "儿童节出生的你，永远保持着一份纯真和快乐，这是最珍贵的礼物！生日快乐，永远年轻！愿你永远保持童心，快乐无边！",
            "10-01": "与国同庆的你，自带光芒万丈的气场！愿你永远自由洒脱，活成自己喜欢的模样～ 生日快乐，愿你如祖国般蓬勃发展！",
            "12-25": "圣诞宝宝，愿你的每一个日子都像圣诞节一样充满惊喜和欢乐，生日快乐！愿你被爱与温暖环绕一整年～",
            "12-31": "岁末的寿星最幸运啦！愿今年的遗憾都成明年的铺垫，新一岁万事胜意～ 祝你生日快乐，未来可期！"
        };
        
        // DOM元素
        const monthWheel = document.getElementById('monthWheel');
        const dayWheel = document.getElementById('dayWheel');
        const submitButton = document.getElementById('submitButton');
        const backButton = document.getElementById('backButton');
        const wishMessage = document.getElementById('wishMessage');
        const selectionPage = document.getElementById('selectionPage');
        const wishPage = document.getElementById('wishPage');
        const confettiContainer = document.getElementById('confettiContainer');
        
        // 波轮配置
        let currentMonth = 1;
        let currentDay = 1;
        const itemHeight = 56; // 每个选项的高度
        const visibleItems = 3; // 可见的选项数量
        const centerIndex = Math.floor(visibleItems / 2); // 中间项的索引
        
        // 初始化月份波轮
        function initMonthWheel() {
            monthWheel.innerHTML = '';
            for (let i = 1; i <= 12; i++) {
                const monthItem = document.createElement('div');
                monthItem.className = `wheel-item ${i === currentMonth ? 'active' : ''}`;
                monthItem.textContent = i.toString().padStart(2, '0');
                monthItem.dataset.value = i;
                monthWheel.appendChild(monthItem);
            }
            updateWheelPosition(monthWheel, currentMonth - 1);
            setupWheelEvents(monthWheel, 12, (value) => {
                currentMonth = value;
                updateDaysForMonth(currentMonth);
            });
        }
        
        // 根据月份更新日期波轮
        function updateDaysForMonth(month) {
            // 计算当月的天数
            let daysInMonth;
            if (month === 2) {
                daysInMonth = 28;
            } else if ([4, 6, 9, 11].includes(month)) {
                daysInMonth = 30;
            } else {
                daysInMonth = 31;
            }
            
            // 如果当前日期大于当月最大天数，自动调整
            if (currentDay > daysInMonth) {
                currentDay = daysInMonth;
            }
            
            // 更新日期波轮
            dayWheel.innerHTML = '';
            for (let i = 1; i <= daysInMonth; i++) {
                const dayItem = document.createElement('div');
                dayItem.className = `wheel-item ${i === currentDay ? 'active' : ''}`;
                dayItem.textContent = i.toString().padStart(2, '0');
                dayItem.dataset.value = i;
                dayWheel.appendChild(dayItem);
            }
            updateWheelPosition(dayWheel, currentDay - 1);
            setupWheelEvents(dayWheel, daysInMonth, (value) => {
                currentDay = value;
            });
        }
        
        // 设置波轮的滑动和点击事件
        function setupWheelEvents(wheel, maxItems, onSelect) {
            let startY = 0;
            let currentTranslateY = 0;
            let startTranslateY = 0;
            let isDragging = false;
            let animationFrameId = null;
            
            // 计算初始位置
            currentTranslateY = -centerIndex * itemHeight;
            
            // 触摸开始
            wheel.addEventListener('touchstart', (e) => {
                isDragging = true;
                startY = e.touches[0].clientY;
                startTranslateY = currentTranslateY;
                wheel.style.transition = 'none';
                cancelAnimationFrame(animationFrameId);
            }, { passive: true });
            
            // 触摸移动
            wheel.addEventListener('touchmove', (e) => {
                if (!isDragging) return;
                const currentY = e.touches[0].clientY;
                const diff = currentY - startY;
                currentTranslateY = startTranslateY + diff;
                
                // 限制滚动范围
                const maxTranslate = 0;
                const minTranslate = -(maxItems - visibleItems) * itemHeight;
                currentTranslateY = Math.max(Math.min(currentTranslateY, maxTranslate), minTranslate);
                
                updateWheelVisual(wheel);
            }, { passive: true });
            
            // 触摸结束
            wheel.addEventListener('touchend', () => {
                if (!isDragging) return;
                isDragging = false;
                snapToNearestItem(wheel, maxItems, onSelect);
            });
            
            // 鼠标事件（用于桌面调试）
            wheel.addEventListener('mousedown', (e) => {
                isDragging = true;
                startY = e.clientY;
                startTranslateY = currentTranslateY;
                wheel.style.transition = 'none';
                cancelAnimationFrame(animationFrameId);
            });
            
            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const currentY = e.clientY;
                const diff = currentY - startY;
                currentTranslateY = startTranslateY + diff;
                
                // 限制滚动范围
                const maxTranslate = 0;
                const minTranslate = -(maxItems - visibleItems) * itemHeight;
                currentTranslateY = Math.max(Math.min(currentTranslateY, maxTranslate), minTranslate);
                
                updateWheelVisual(wheel);
            });
            
            document.addEventListener('mouseup', () => {
                if (!isDragging) return;
                isDragging = false;
                snapToNearestItem(wheel, maxItems, onSelect);
            });
            
            // 点击项目直接选择
            wheel.addEventListener('click', (e) => {
                const item = e.target.closest('.wheel-item');
                if (item) {
                    const index = Array.from(wheel.children).indexOf(item);
                    currentTranslateY = -index * itemHeight + centerIndex * itemHeight;
                    updateWheelPosition(wheel, index);
                    onSelect(parseInt(item.dataset.value));
                    highlightSelectedItem(wheel, index);
                }
            });
            
            // 更新波轮视觉效果
            function updateWheelVisual(wheel) {
                wheel.style.transform = `translateY(${currentTranslateY}px)`;
                
                // 更新激活状态
                const items = wheel.querySelectorAll('.wheel-item');
                items.forEach((item, index) => {
                    const itemTop = index * itemHeight + currentTranslateY;
                    const itemCenter = itemTop + itemHeight / 2;
                    const wheelCenter = wheel.offsetHeight / 2;
                    const distance = Math.abs(itemCenter - wheelCenter);
                    
                    // 根据距离中心的距离调整样式
                    if (distance < itemHeight / 2) {
                        item.classList.add('active');
                    } else {
                        item.classList.remove('active');
                    }
                });
            }
            
            // 吸附到最近的项目
            function snapToNearestItem(wheel, maxItems, onSelect) {
                const index = Math.round(-currentTranslateY / itemHeight);
                const clampedIndex = Math.max(0, Math.min(index, maxItems - 1));
                currentTranslateY = -clampedIndex * itemHeight + centerIndex * itemHeight;
                
                // 应用动画
                wheel.style.transition = 'transform 0.3s ease-out';
                wheel.style.transform = `translateY(${currentTranslateY}px)`;
                
                // 高亮选中项
                highlightSelectedItem(wheel, clampedIndex);
                
                // 触发选择事件
                const selectedValue = parseInt(wheel.children[clampedIndex].dataset.value);
                onSelect(selectedValue);
            }
        }
        
        // 更新波轮位置
        function updateWheelPosition(wheel, index) {
            const newTranslateY = -index * itemHeight + centerIndex * itemHeight;
            wheel.style.transform = `translateY(${newTranslateY}px)`;
            highlightSelectedItem(wheel, index);
        }
        
        // 高亮选中的项目
        function highlightSelectedItem(wheel, selectedIndex) {
            const items = wheel.querySelectorAll('.wheel-item');
            items.forEach((item, index) => {
                if (index === selectedIndex) {
                    item.classList.add('active');
                } else {
                    item.classList.remove('active');
                }
            });
        }
        
        // 切换到祝福页面
        function showWishPage() {
            selectionPage.classList.add('page-hidden');
            wishPage.classList.remove('page-hidden');
        }
        
        // 切换回选择页面
        function showSelectionPage() {
            wishPage.classList.add('page-hidden');
            selectionPage.classList.remove('page-hidden');
        }
        
        // 提交按钮事件
        submitButton.addEventListener('click', function() {
            const formattedMonth = currentMonth.toString().padStart(2, '0');
            const formattedDay = currentDay.toString().padStart(2, '0');
            const birthday = `${formattedMonth}-${formattedDay}`;
            
            // 设置祝福内容
            if (birthdayWishes.hasOwnProperty(birthday)) {
                wishMessage.textContent = birthdayWishes[birthday];
            } else {
                wishMessage.textContent = `虽然还没为${birthday}准备特别的祝福，但我想告诉你：你对我来说是非常特别的朋友！祝你生日快乐，每天都开开心心，所有的梦想都能实现！`;
            }
            
            // 创建从中心炸开的彩屑效果
            createConfettiExplosion();
            
            // 彩屑动画结束后跳转到祝福页面
            setTimeout(showWishPage, 1500);
        });
        
        // 返回按钮事件
        backButton.addEventListener('click', function() {
            showSelectionPage();
        });
        
        // 创建从中心炸开的彩屑效果
        function createConfettiExplosion() {
            // 清空之前的彩屑
            confettiContainer.innerHTML = '';
            
            const colors = ['#FF6B8B', '#6B9FFF', '#FFD166', '#06D6A0', '#118AB2', '#EF476F', '#118AB2'];
            const count = 150; // 彩屑数量
            
            // 获取屏幕中心
            const centerX = window.innerWidth / 2;
            const centerY = window.innerHeight / 2;
            
            for (let i = 0; i < count; i++) {
                const confetti = document.createElement('div');
                
                // 随机属性
                const size = Math.random() * 8 + 4;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const angle = Math.random() * Math.PI * 2; // 随机角度（0到360度）
                const distance = Math.random() * Math.min(window.innerWidth, window.innerHeight) / 2; // 随机距离
                
                // 计算终点坐标
                const endX = Math.cos(angle) * distance;
                const endY = Math.sin(angle) * distance;
                
                // 设置样式
                confetti.style.position = 'absolute';
                confetti.style.width = `${size}px`;
                confetti.style.height = `${size}px`;
                confetti.style.backgroundColor = color;
                confetti.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
                confetti.style.left = `${centerX}px`;
                confetti.style.top = `${centerY}px`;
                confetti.style.transform = 'translate(-50%, -50%) scale(0)';
                confetti.style.opacity = '1';
                
                // 设置自定义属性用于动画
                confetti.style.setProperty('--tx', `${endX}px`);
                confetti.style.setProperty('--ty', `${endY}px`);
                
                // 设置动画
                const duration = Math.random() * 1 + 1; // 1-2秒
                confetti.style.animation = `explode ${duration}s ease-out forwards`;
                
                confettiContainer.appendChild(confetti);
                
                // 动画结束后移除元素
                setTimeout(() => {
                    confetti.remove();
                }, duration * 1000);
            }
        }
        
        // 初始化
        window.addEventListener('DOMContentLoaded', () => {
            initMonthWheel();
            updateDaysForMonth(currentMonth);
            
            // 防止页面在移动设备上被缩放
            document.addEventListener('touchmove', function(e) {
                if (e.touches.length > 1) {
                    e.preventDefault();
                }
            }, { passive: false });
        });
    </script>
</body>
</html>
