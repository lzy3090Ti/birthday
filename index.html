<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="温馨的生日祝福页面，选择日期即可查看专属祝福卡片与动画效果。">
    <meta name="theme-color" content="#ff6b9d">
    <meta name="color-scheme" content="light">
    <meta name="format-detection" content="telephone=no">
    <title>生日祝福 🌟</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
    <link href="index.css" rel="stylesheet">
</head>
<body>
    <a class="skip-link" href="#app">跳到主要内容</a>
    <noscript>
        <p class="noscript-tip">请启用 JavaScript 以体验完整的生日祝福互动效果。</p>
    </noscript>
    <main id="app" class="app" role="main" aria-label="生日祝福页面">
        <div class="app-decor" aria-hidden="true">
            <span class="decor-dot decor-dot-1"></span>
            <span class="decor-dot decor-dot-2"></span>
            <span class="decor-dot decor-dot-3"></span>
        </div>
        <header class="app-header">
            <h1 class="app-title">生日祝福 🌟</h1>
            <p class="app-subtitle">选择日期，收获一份专属的祝福</p>
        </header>
        <section id="birthday-section" class="birthday-section" aria-labelledby="birthday-label">
            <label id="birthday-label" for="birthday-input" class="birthday-label">
                选择生日日期
                <span class="birthday-required" aria-hidden="true">*</span>
            </label>
            <input
                id="birthday-input"
                class="birthday-input"
                type="date"
                name="birthday"
                min="1900-01-01"
                max="2100-12-31"
                required
                aria-describedby="birthday-hint birthday-preview"
                autocomplete="bday"
            >
            <p id="birthday-hint" class="birthday-hint">支持移动端日期选择，选好后即可生成祝福卡片。</p>
            <p id="birthday-preview" class="birthday-preview" aria-live="polite" aria-atomic="true">
                尚未选择日期
            </p>
            <div class="birthday-actions" role="group" aria-label="日期快捷操作">
                <button id="today-btn" class="btn btn-ghost" type="button" aria-label="选择今天的日期">
                    <i class="fa fa-calendar-check-o" aria-hidden="true"></i> 今天
                </button>
                <button id="this-month-btn" class="btn btn-ghost" type="button" aria-label="选择本月第一天的日期">
                    <i class="fa fa-calendar" aria-hidden="true"></i> 本月
                </button>
                <button id="next-month-btn" class="btn btn-ghost" type="button" aria-label="选择下个月第一天的日期">
                    <i class="fa fa-calendar-plus-o" aria-hidden="true"></i> 下月
                </button>
                <button id="generate-btn" class="btn btn-primary" type="button" aria-label="生成生日祝福卡片">
                    <i class="fa fa-magic" aria-hidden="true"></i> 生成祝福
                </button>
                <button id="reset-btn" class="btn btn-ghost" type="button" aria-label="清空生日日期">
                    <i class="fa fa-eraser" aria-hidden="true"></i> 清空
                </button>
            </div>
        </section>
        <section id="card-section" class="card-section" aria-live="polite" aria-atomic="true" aria-busy="false" aria-label="祝福卡片区域">
            <!-- 祝福卡片由脚本渲染 -->
            <div class="card-placeholder" id="card-placeholder">
                <i class="fa fa-gift card-placeholder-icon" aria-hidden="true"></i>
                <p class="card-placeholder-text">还没有祝福卡片，先选择日期吧～</p>
            </div>
        </section>
        <footer class="app-footer">
            <p class="app-footer-text">愿每一天都有值得庆祝的小确幸</p>
        </footer>
    </main>
    <script src="index.js" defer></script>
</body>
</html>
