<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="温馨的生日祝福页面，选择日期即可查看专属祝福卡片与动画效果。">
    <meta name="theme-color" content="#ff6b9d">
    <meta name="color-scheme" content="light">
    <meta name="format-detection" content="telephone=no">
    <title>生日祝福 🌟</title>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preload" href="index.css" as="style">
    <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet"></noscript>
    <link href="index.css" rel="stylesheet">
    <style>
        /* 首屏关键样式，避免字体图标加载前出现布局跳动 */
        .app{max-width:640px;margin:0 auto;padding:24px 16px 40px;padding-bottom:calc(40px + env(safe-area-inset-bottom));}
        .skip-link{position:absolute;left:-9999px;top:0;background:#ff6b9d;color:#fff;padding:10px 16px;border-radius:0 0 8px 0;z-index:100;}
        .skip-link:focus{left:0;outline:2px solid #fff;outline-offset:2px;}
        .btn{min-height:44px;touch-action:manipulation;}
        .birthday-input{font-size:16px;min-height:48px;width:100%;}
        .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
        .chip-row .btn{flex:1 1 auto;justify-content:center;}
        .card-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
        .card-actions[hidden]{display:none;}
        .birthday-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
        .meta-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:rgba(255,107,157,.12);color:#b8436f;font-size:13px;line-height:1.4;}
        .meta-tag[hidden]{display:none;}
        .card-skeleton{padding:24px 18px;border-radius:16px;background:rgba(255,255,255,.7);display:flex;flex-direction:column;gap:12px;}
        .card-skeleton[hidden]{display:none;}
        .card-skeleton-line{height:14px;border-radius:8px;background:linear-gradient(90deg,rgba(255,107,157,.12),rgba(255,107,157,.28),rgba(255,107,157,.12));background-size:200% 100%;animation:skeleton-shimmer 1.4s ease-in-out infinite;}
        .card-skeleton-line:nth-child(2){width:80%;}
        .card-skeleton-line:nth-child(3){width:60%;}
        @keyframes skeleton-shimmer{0%{background-position:200% 0;}100%{background-position:-200% 0;}}
        @media (prefers-reduced-motion: reduce){.card-skeleton-line{animation:none;}}
        .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;}
        .birthday-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
        .birthday-actions .btn{flex:1 1 140px;justify-content:center;}
        .noscript-tip{margin:16px;padding:12px 16px;border-radius:12px;background:#fff3f7;color:#b8436f;text-align:center;}
        .card-section-heading{font-size:15px;font-weight:600;color:#b8436f;margin:24px 0 12px;display:flex;align-items:center;gap:8px;}
        .card-section-heading::after{content:"";flex:1;height:1px;background:rgba(255,107,157,.2);}
        .card-placeholder{display:flex;flex-direction:column;align-items:center;gap:10px;padding:32px 18px;border-radius:16px;background:rgba(255,255,255,.6);border:1px dashed rgba(255,107,157,.35);text-align:center;}
        .card-placeholder-icon{font-size:28px;color:#ff6b9d;}
        .card-placeholder-text{margin:0;color:#8a5a6c;font-size:14px;line-height:1.6;}
        .share-tip{margin:8px 0 0;font-size:13px;color:#b8436f;text-align:center;}
        .share-tip[hidden]{display:none;}

        /* 步骤提示：让操作路径更清晰 */
        .step-bar{display:flex;align-items:center;gap:6px;margin:0 0 18px;padding:0;list-style:none;font-size:12px;color:#8a5a6c;overflow-x:auto;scrollbar-width:none;}
        .step-bar::-webkit-scrollbar{display:none;}
        .step-bar li{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
        .step-bar li::after{content:"";width:16px;height:1px;background:rgba(255,107,157,.3);}
        .step-bar li:last-child::after{display:none;}
        .step-dot{display:inline-flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;background:rgba(255,107,157,.14);color:#b8436f;font-size:11px;font-weight:600;transition:background .2s ease,color .2s ease;}
        .step-bar li[aria-current="step"] .step-dot{background:#ff6b9d;color:#fff;}
        .step-bar li[data-done="true"] .step-dot{background:rgba(255,107,157,.28);color:#b8436f;}
        @media (prefers-reduced-motion: reduce){.step-dot{transition:none;}}

        /* 日期输入增强 */
        .input-wrap{position:relative;display:flex;align-items:center;gap:8px;}
        .input-wrap .birthday-input{flex:1 1 auto;}
        .input-clear{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,107,157,.35);background:rgba(255,255,255,.8);color:#b8436f;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;touch-action:manipulation;}
        .input-clear[hidden]{display:none;}
        .input-clear:focus-visible{outline:2px solid #ff6b9d;outline-offset:2px;}
        .birthday-hint{margin:8px 0 0;font-size:13px;color:#8a5a6c;line-height:1.5;}
        .birthday-error{margin:8px 0 0;font-size:13px;color:#d23c6a;line-height:1.5;}
        .birthday-error[hidden]{display:none;}
        .birthday-preview{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:rgba(255,107,157,.08);color:#7a4358;font-size:14px;line-height:1.6;}
        .birthday-preview.is-empty{color:#9a7a86;background:rgba(255,107,157,.05);}

        /* 月份切换条 */
        .month-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0 0;padding:8px 10px;border-radius:12px;background:rgba(255,255,255,.7);border:1px solid rgba(255,107,157,.18);}
        .month-bar-label{flex:1 1 auto;text-align:center;font-size:14px;font-weight:600;color:#b8436f;}
        .month-bar .btn{min-height:40px;padding:0 14px;}

        /* 卡片容器 */
        .card-stage{position:relative;min-height:120px;}
        .card-stage > *{transition:opacity .25s ease;}
        @media (prefers-reduced-motion: reduce){.card-stage > *{transition:none;}}

        /* 日期快捷选择与月份联动提示 */
        .quick-picks{margin-top:10px;}
        .quick-picks .btn[aria-pressed="true"]{border-color:#ff6b9d;background:rgba(255,107,157,.14);color:#b8436f;}

        /* 祝福卡片状态提示 */
        .card-status{margin:0 0 10px;font-size:13px;color:#8a5a6c;min-height:18px;}
        .card-status[hidden]{display:none;}

        /* 移动端悬浮操作栏 */
        .mobile-action-bar{position:fixed;left:0;right:0;bottom:0;z-index:50;display:none;gap:8px;padding:10px 12px;padding-bottom:calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid rgba(255,107,157,.18);}
        .mobile-action-bar .btn{flex:1 1 0;justify-content:center;min-height:46px;}
        .mobile-action-bar[hidden]{display:none;}
        @media (max-width:520px){
            .mobile-action-bar{display:flex;}
            .app{padding-bottom:calc(84px + env(safe-area-inset-bottom));}
        }

        /* 小屏优化 */
        @media (max-width:360px){
            .app{padding-left:12px;padding-right:12px;}
            .step-bar{font-size:11px;}
            .birthday-actions .btn{flex:1 1 100%;}
            .month-bar-label{font-size:13px;}
            .mobile-action-bar .btn{font-size:13px;}
        }

        .visually-hidden:focus{position:static;width:auto;height:auto;clip:auto;white-space:normal;}

        /* 日期信息补充与卡片聚焦 */
        .birthday-extra{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px;}
        .birthday-extra .meta-tag{background:rgba(255,193,7,.14);color:#8a6b1f;}
        .card-stage:focus-visible{outline:2px solid #ff6b9d;outline-offset:4px;border-radius:16px;}
        .card-container{outline:none;}
        .card-container:focus-visible{outline:2px solid #ff6b9d;outline-offset:4px;border-radius:16px;}
        .app-footer-text{margin:24px 0 0;text-align:center;font-size:13px;color:#9a7a86;}
        .card-actions .btn[disabled]{opacity:.5;cursor:not-allowed;}

        /* 日期摘要卡：选中后即时反馈 */
        .date-summary{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(255,107,157,.1),rgba(255,193,7,.1));border:1px solid rgba(255,107,157,.18);}
        .date-summary[hidden]{display:none;}
        .date-summary-icon{flex:0 0 auto;width:44px;height:44px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#fff;color:#ff6b9d;font-size:20px;box-shadow:0 2px 8px rgba(255,107,157,.18);}
        .date-summary-body{flex:1 1 auto;min-width:0;}
        .date-summary-title{margin:0;font-size:15px;font-weight:600;color:#7a4358;}
        .date-summary-sub{margin:2px 0 0;font-size:13px;color:#9a7a86;}

        /* 卡片操作按钮在小屏下更易点按 */
        @media (max-width:520px){
            .card-actions .btn{flex:1 1 100%;}
            .card-actions{padding-bottom:4px;}
        }

        /* 减少动效偏好 */
        @media (prefers-reduced-motion: reduce){
            *{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important;scroll-behavior:auto !important;}
        }

        /* 内联图标兜底：字体图标未加载时仍可辨识 */
        .fa{display:inline-block;min-width:1em;text-align:center;}
        .icon-fallback{font-family:inherit;font-style:normal;}

        /* 卡片内文案排版增强，提升可读性 */
        .card-container .birthday-card{word-break:break-word;}
        .card-container p{line-height:1.7;}

        /* 页脚补充说明 */
        .app-footer-note{margin:6px 0 0;text-align:center;font-size:12px;color:#b09aa3;line-height:1.6;}

        /* 新增：日期快捷选择后的滚动锚点与卡片高亮 */
        .card-section.is-highlighted .card-container{animation:card-pop .45s ease;}
        @keyframes card-pop{0%{transform:scale(.97);}60%{transform:scale(1.01);}100%{transform:scale(1);}}
        @media (prefers-reduced-motion: reduce){.card-section.is-highlighted .card-container{animation:none;}}

        /* 新增：输入框聚焦态更明显，便于键盘与触屏操作 */
        .birthday-input:focus-visible{outline:2px solid #ff6b9d;outline-offset:2px;border-radius:10px;}

        /* 新增：月份切换按钮禁用态 */
        .month-bar .btn[disabled]{opacity:.4;cursor:not-allowed;}

        /* 新增：复制成功时按钮的短暂反馈 */
        .btn.is-success{border-color:#2e9e6b !important;color:#2e9e6b !important;background:rgba(46,158,107,.1) !important;}

        /* 新增：卡片状态与提示的紧凑布局 */
        .card-section{scroll-margin-top:16px;}
        #birthday-section{scroll-margin-top:16px;}

        /* 新增：日历网格（替代原生日期控件，移动端更友好） */
        .calendar{margin-top:12px;padding:12px 10px;border-radius:16px;background:rgba(255,255,255,.72);border:1px solid rgba(255,107,157,.18);}
        .calendar[hidden]{display:none;}
        .calendar-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;}
        .calendar-title{font-size:14px;font-weight:600;color:#b8436f;}
        .calendar-nav{display:inline-flex;gap:6px;}
        .calendar-nav .btn{min-height:36px;min-width:36px;padding:0 10px;}
        .calendar-weekdays,.calendar-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;}
        .calendar-weekdays{margin-bottom:4px;}
        .calendar-weekday{text-align:center;font-size:11px;color:#9a7a86;padding:2px 0;}
        .calendar-day{position:relative;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:10px;border:1px solid transparent;background:transparent;color:#5a3d48;font-size:14px;font-family:inherit;cursor:pointer;touch-action:manipulation;transition:background .15s ease,border-color .15s ease;}
        .calendar-day:hover{background:rgba(255,107,157,.1);}
        .calendar-day:focus-visible{outline:2px solid #ff6b9d;outline-offset:1px;}
        .calendar-day.is-outside{color:#c9b4bd;}
        .calendar-day.is-today{border-color:rgba(255,107,157,.5);font-weight:600;}
        .calendar-day.is-selected{background:#ff6b9d;color:#fff;border-color:#ff6b9d;font-weight:600;}
        .calendar-day.is-selected.is-today{box-shadow:0 0 0 2px rgba(255,107,157,.25);}
        .calendar-day:disabled{opacity:.35;cursor:not-allowed;}
        .calendar-day[aria-current="date"]::after{content:"";position:absolute;bottom:4px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7;}
        @media (prefers-reduced-motion: reduce){.calendar-day{transition:none;}}
        @media (max-width:360px){.calendar-day{min-height:36px;font-size:13px;}}

        /* 新增：视图切换（日历 / 原生输入） */
        .view-toggle{display:inline-flex;gap:6px;margin-top:10px;}
        .view-toggle .btn{min-height:40px;flex:1 1 auto;justify-content:center;}
        .view-toggle .btn[aria-pressed="true"]{border-color:#ff6b9d;background:rgba(255,107,157,.14);color:#b8436f;}

        /* 新增：祝福卡片视觉层次 */
        .card-container .birthday-card{position:relative;overflow:hidden;border-radius:18px;padding:26px 20px;background:linear-gradient(150deg,#fff 0%,#fff6fa 55%,#fff9ec 100%);border:1px solid rgba(255,107,157,.22);box-shadow:0 10px 30px rgba(255,107,157,.14);}
        .card-container .birthday-card::before{content:"";position:absolute;top:-40px;right:-40px;width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,rgba(255,193,7,.28),transparent 70%);pointer-events:none;}
        .card-container .birthday-card::after{content:"";position:absolute;bottom:-50px;left:-30px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(255,107,157,.18),transparent 70%);pointer-events:none;}
        .card-container .birthday-card > *{position:relative;z-index:1;}
        .card-container .birthday-card h3{margin:0 0 10px;font-size:19px;color:#b8436f;}
        .card-container .birthday-card p{margin:0 0 8px;color:#5a3d48;font-size:15px;}
        .card-container .birthday-card p:last-child{margin-bottom:0;}
        .card-container .birthday-card .card-sign{display:block;margin-top:14px;font-size:13px;color:#9a7a86;text-align:right;}

        /* 新增：装饰元素在卡片生成后淡出，减少视觉噪音 */
        .app-decor{transition:opacity .4s ease;}
        .app.has-card .app-decor{opacity:.5;}
        @media (prefers-reduced-motion: reduce){.app-decor{transition:none;}}
    </style>
</head>
<body>
    <a class="skip-link" href="#app">跳到主要内容</a>
    <noscript>
        <p class="noscript-tip">请启用 JavaScript 以体验完整的生日祝福互动效果。</p>
    </noscript>
    <main id="app" class="app" role="main" aria-label="生日祝福页面" tabindex="-1">
        <div class="app-decor" aria-hidden="true">
            <span class="decor-dot decor-dot-1"></span>
            <span class="decor-dot decor-dot-2"></span>
            <span class="decor-dot decor-dot-3"></span>
        </div>
        <header class="app-header">
            <h1 class="app-title">生日祝福 🌟</h1>
            <p class="app-subtitle">选择日期，收获一份专属的祝福</p>
        </header>

        <ol class="step-bar" id="step-bar" aria-label="使用步骤">
            <li aria-current="step" data-step="1"><span class="step-dot" aria-hidden="true">1</span>选择日期</li>
            <li data-step="2"><span class="step-dot" aria-hidden="true">2</span>生成祝福</li>
            <li data-step="3"><span class="step-dot" aria-hidden="true">3</span>分享心意</li>
        </ol>

        <section id="birthday-section" class="birthday-section" aria-labelledby="birthday-label">
            <label id="birthday-label" for="birthday-input" class="birthday-label">
                选择生日日期
                <span class="birthday-required" aria-hidden="true">*</span>
            </label>

            <div class="view-toggle" role="group" aria-label="日期选择方式">
                <button id="view-calendar-btn" class="btn btn-ghost" type="button" aria-pressed="true" aria-controls="calendar-panel">
                    <i class="fa fa-calendar" aria-hidden="true"></i> 日历选择
                </button>
                <button id="view-input-btn" class="btn btn-ghost" type="button" aria-pressed="false" aria-controls="input-panel">
                    <i class="fa fa-keyboard-o" aria-hidden="true"></i> 手动输入
                </button>
            </div>

            <!-- 日历面板：移动端更易点按的日期选择 -->
            <div id="calendar-panel" class="calendar" aria-label="日期日历" role="group">
                <div class="calendar-head">
                    <span id="calendar-title" class="calendar-title" aria-live="polite">本月</span>
                    <span class="calendar-nav">
                        <button id="calendar-prev-btn" class="btn btn-ghost" type="button" aria-label="上一个月">
                            <i class="fa fa-chevron-left" aria-hidden="true"></i>
                        </button>
                        <button id="calendar-today-btn" class="btn btn-ghost" type="button" aria-label="回到本月">
                            <i class="fa fa-dot-circle-o" aria-hidden="true"></i>
                        </button>
                        <button id="calendar-next-btn" class="btn btn-ghost" type="button" aria-label="下一个月">
                            <i class="fa fa-chevron-right" aria-hidden="true"></i>
                        </button>
                    </span>
                </div>
                <div class="calendar-weekdays" aria-hidden="true">
                    <span class="calendar-weekday">日</span>
                    <span class="calendar-weekday">一</span>
                    <span class="calendar-weekday">二</span>
                    <span class="calendar-weekday">三</span>
                    <span class="calendar-weekday">四</span>
                    <span class="calendar-weekday">五</span>
                    <span class="calendar-weekday">六</span>
                </div>
                <div id="calendar-grid" class="calendar-grid" role="grid" aria-labelledby="calendar-title"></div>
            </div>

            <!-- 原生输入面板 -->
            <div id="input-panel" class="input-panel" hidden>
                <div class="input-wrap">
                    <input
                        id="birthday-input"
                        class="birthday-input"
                        type="date"
                        name="birthday"
                        min="1900-01-01"
                        max="2100-12-31"
                        required
                        aria-describedby="birthday-hint birthday-preview birthday-error"
                        aria-invalid="false"
                        autocomplete="bday"
                        inputmode="numeric"
                        placeholder="年 / 月 / 日"
                    >
                    <button id="input-clear-btn" class="input-clear" type="button" aria-label="清除已选日期" title="清除日期" hidden>
                        <i class="fa fa-times" aria-hidden="true"></i>
                    </button>
                </div>
            </div>

            <p id="birthday-hint" class="birthday-hint">点击日历中的日期即可选择，也可以切换到手动输入。</p>

            <div class="chip-row quick-picks" role="group" aria-label="快捷日期选择">
                <button id="today-btn" class="btn btn-ghost" type="button" aria-label="选择今天的日期" aria-pressed="false">
                    <i class="fa fa-calendar-check-o" aria-hidden="true"></i> 今天
                </button>
                <button id="this-month-btn" class="btn btn-ghost" type="button" aria-label="选择本月第一天的日期" aria-pressed="false">
                    <i class="fa fa-calendar" aria-hidden="true"></i> 本月
                </button>
                <button id="next-month-btn" class="btn btn-ghost" type="button" aria-label="选择下个月第一天的日期" aria-pressed="false">
                    <i class="fa fa-calendar-plus-o" aria-hidden="true"></i> 下月
                </button>
            </div>
            <div class="birthday-meta" aria-live="polite" aria-atomic="true">
                <span id="weekday-tag" class="meta-tag" hidden>
                    <i class="fa fa-clock-o" aria-hidden="true"></i>
                    <span id="weekday-text"></span>
                </span>
                <span id="zodiac-tag" class="meta-tag" hidden>
                    <i class="fa fa-star-o" aria-hidden="true"></i>
                    <span id="zodiac-text"></span>
                </span>
                <span id="countdown-tag" class="meta-tag" hidden>
                    <i class="fa fa-hourglass-half" aria-hidden="true"></i>
                    <span id="countdown-text"></span>
                </span>
            </div>
            <div class="birthday-extra" aria-live="polite" aria-atomic="true">
                <span id="age-tag" class="meta-tag" hidden>
                    <i class="fa fa-birthday-cake" aria-hidden="true"></i>
                    <span id="age-text"></span>
                </span>
                <span id="season-tag" class="meta-tag" hidden>
                    <i class="fa fa-leaf" aria-hidden="true"></i>
                    <span id="season-text"></span>
                </span>
            </div>

            <!-- 日期摘要卡：选择后即时反馈，提升移动端确认感 -->
            <div id="date-summary" class="date-summary" hidden aria-live="polite" aria-atomic="true">
                <span class="date-summary-icon" aria-hidden="true"><i class="fa fa-calendar-check-o"></i></span>
                <div class="date-summary-body">
                    <p id="date-summary-title" class="date-summary-title">已选择日期</p>
                    <p id="date-summary-sub" class="date-summary-sub">点击下方按钮生成专属祝福</p>
                </div>
            </div>

            <p id="birthday-error" class="birthday-error" role="alert" hidden></p>
            <p id="birthday-preview" class="birthday-preview is-empty" aria-live="polite" aria-atomic="true">
                尚未选择日期
            </p>
            <div class="birthday-actions" role="group" aria-label="日期操作">
                <button id="generate-btn" class="btn btn-primary" type="button" aria-label="生成生日祝福卡片">
                    <i class="fa fa-magic" aria-hidden="true"></i> 生成祝福
                </button>
                <button id="reset-btn" class="btn btn-ghost" type="button" aria-label="清空生日日期">
                    <i class="fa fa-eraser" aria-hidden="true"></i> 清空
                </button>
            </div>
        </section>

        <h2 class="card-section-heading" id="card-heading">
            <i class="fa fa-heart" aria-hidden="true"></i> 专属祝福卡片
        </h2>
        <section id="card-section" class="card-section" aria-live="polite" aria-atomic="true" aria-busy="false" aria-labelledby="card-heading">
            <p id="card-status" class="card-status" role="status" aria-live="polite" hidden></p>
            <div class="card-stage" id="card-stage">
                <!-- 祝福卡片由脚本渲染，以下为不同阶段的占位内容 -->
                <div class="card-placeholder" id="card-placeholder">
                    <i class="fa fa-gift card-placeholder-icon" aria-hidden="true"></i>
                    <p class="card-placeholder-text">还没有祝福卡片，先选择日期吧～</p>
                </div>
                <div class="card-skeleton" id="card-skeleton" hidden aria-hidden="true">
                    <div class="card-skeleton-line"></div>
                    <div class="card-skeleton-line"></div>
                    <div class="card-skeleton-line"></div>
                </div>
                <div id="card-container" class="card-container" hidden tabindex="-1"></div>
            </div>
        </section>

        <div id="card-actions" class="card-actions" role="group" aria-label="祝福卡片操作" hidden>
            <button id="regenerate-btn" class="btn btn-ghost" type="button" aria-label="重新生成祝福卡片">
                <i class="fa fa-refresh" aria-hidden="true"></i> 换一句祝福
            </button>
            <button id="copy-btn" class="btn btn-ghost" type="button" aria-label="复制当前祝福文字">
                <i class="fa fa-copy" aria-hidden="true"></i> 复制祝福
            </button>
            <button id="pick-again-btn" class="btn btn-ghost" type="button" aria-label="返回并重新选择日期">
                <i class="fa fa-pencil" aria-hidden="true"></i> 重新选日期
            </button>
        </div>
        <p id="share-tip" class="share-tip" role="status" aria-live="polite" hidden></p>
        <footer class="app-footer">
            <p class="app-footer-text">愿每一天都有值得庆祝的小确幸</p>
            <p class="app-footer-note">所有信息仅在本机处理，不会上传服务器。</p>
        </footer>
    </main>

    <!-- 移动端悬浮操作栏：无需滚动即可快速操作 -->
    <div id="mobile-action-bar" class="mobile-action-bar" role="group" aria-label="快捷操作" hidden>
        <button id="mobile-generate-btn" class="btn btn-primary" type="button" aria-label="生成生日祝福卡片">
            <i class="fa fa-magic" aria-hidden="true"></i> 生成祝福
        </button>
        <button id="mobile-copy-btn" class="btn btn-ghost" type="button" aria-label="复制当前祝福文字" hidden>
            <i class="fa fa-copy" aria-hidden="true"></i> 复制
        </button>
    </div>

    <script src="index.js" defer></script>
</body>
</html>
